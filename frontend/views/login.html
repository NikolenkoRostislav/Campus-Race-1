<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tavern - Auth</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js" defer></script>
</head>

<body style="--page-bg: url('/assets/Bar1.png');">

    <div class="auth-layout">
        
        <div class="nav-buttons">
            <button id="showLoginBtn" class="img-btn" style="background-image: url('/assets/Login.png');"></button>
            
            <button id="showRegisterBtn" class="img-btn" style="background-image: url('/assets/Register.png');"></button>
        </div>

        <div class="form-panel">
            
            <div id="loginSection">
                <h2>Login</h2>
                <form id="loginForm">
                    <input name="login" placeholder="Login" required />
                    <input type="password" name="password" placeholder="Password" required />
                    <button type="submit" class="submit-btn">Enter Tavern</button>
                </form>
                <p id="loginMessage" class="message"></p>
            </div>

            <div id="registerSection" class="hidden">
                <h2>Register</h2>
                <form id="registerForm">
                    <input name="login" placeholder="Login" required />
                    <input type="password" name="password" placeholder="Password" required />
                    <input type="password" name="confirmPassword" placeholder="Confirm password" required />
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>
                <p id="registerMessage" class="message"></p>
            </div>

        </div>
    </div>

</body>

</html>
