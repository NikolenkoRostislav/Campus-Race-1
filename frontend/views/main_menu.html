<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Main Menu - Tavern Game</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/main_menu.js" defer></script>
</head>

<body style="--page-bg: url('/assets/Bar1.png');">

    <div class="menu-layout">
        
        <div class="left-nav">
            <button id="createRoomBtn" class="menu-btn" style="background-image: url('/assets/CreateRoom.png');"></button>
            <button id="showJoinRoomBtn" class="menu-btn" style="background-image: url('/assets/JoinRoom.png');"></button>
            <button id="showProfileBtn" class="menu-btn" style="background-image: url('/assets/ChangeProfile.png');"></button>
            <button id="logoutBtn" class="menu-btn" style="background-image: url('/assets/Logout.png');"></button>
        </div>

        <div class="content-area">
            
            <div id="dashboardView" class="form-panel">
                <h2>Welcome</h2>
                <p id="userID">Loading...</p>
                <img id="userAvatar" src="" alt="Avatar" style="width:100px; height:100px; border-radius:50%; margin: 15px auto; display:none;">
            </div>

            <div id="joinRoomView" class="form-panel hidden">
                <h2>Join Room</h2>
                <form id="joinRoomForm">
                    <input name="roomId" placeholder="Enter Room ID" required />
                    <button type="submit" class="submit-btn">Connect</button>
                </form>
                <p id="joinMessage" class="message"></p>
            </div>

            <div id="profileView" class="form-panel hidden">
                <h2>Update Avatar</h2>
                <form id="profileForm">
                    <p style="text-align: left; margin-bottom: 5px; font-weight: bold; color: #333;">URL Image:</p>
                    <input type="text" name="avatarUrl" placeholder="https://example.com/image.png" />
                    
                    <p style="margin: 10px 0; color: #555; font-weight: bold;">OR</p>
                    
                    <p style="text-align: left; margin-bottom: 5px; font-weight: bold; color: #333;">Upload File:</p>
                    <input type="file" name="avatarFile" accept="image/png, image/jpeg" class="file-upload" />
                    
                    <button type="submit" class="submit-btn" style="margin-top: 15px;">Save Profile</button>
                </form>
                <p id="profileMessage" class="message"></p>
            </div>

        </div>
    </div>

</body>
</html>
